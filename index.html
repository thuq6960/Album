<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Memories — Photo Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0c0c0c;
    --surface: #161616;
    --text: #e8e8e8;
    --muted: #888888;
    --border: rgba(255, 255, 255, 0.08);
    --radius: 10px;
    --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ===== HEADER ===== */
  header {
    text-align: center;
    padding: 80px 24px 50px;
  }

  .subtitle {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: 16px;
  }

  header h1 {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 500;
    letter-spacing: -0.6px;
    color: #f0f0f0;
    margin-bottom: 14px;
  }

  .description {
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
    max-width: 400px;
    margin: 0 auto;
  }

  /* ===== GALLERY ===== */
  .gallery {
    max-width: 1240px;
    margin: 0 auto;
    padding: 30px 24px 90px;
    columns: 3;
    column-gap: 18px;
  }

  .photo {
    break-inside: avoid;
    margin-bottom: 18px;
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    cursor: pointer;
    transition: var(--transition);
  }

  .photo:hover {
    transform: translateY(-4px);
  }

  .photo img {
    width: 100%;
    display: block;
    transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .photo:hover img {
    transform: scale(1.04);
  }

  .photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 45%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .photo:hover::after {
    opacity: 1;
  }

  .photo .view-icon {
    position: absolute;
    bottom: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(6px);
    transition: var(--transition);
    z-index: 2;
    color: #fff;
    font-size: 15px;
  }

  .photo:hover .view-icon {
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== FOOTER ===== */
  footer {
    text-align: center;
    padding: 36px 20px 48px;
    color: #666;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    border-top: 1px solid var(--border);
  }

  /* ===== LIGHTBOX ===== */
  .viewer {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.96);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    padding: 20px;
  }

  .viewer.active {
    opacity: 1;
    visibility: visible;
  }

  .viewer-content {
    position: relative;
    max-width: 92vw;
    max-height: 88vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .viewer img {
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 6px;
    transform: scale(0.97);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .viewer.active img {
    transform: scale(1);
  }

  .close-btn,
  .nav-btn {
    position: absolute;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: #eee;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 22px;
    z-index: 10;
  }

  .close-btn:hover,
  .nav-btn:hover {
    background: rgba(255,255,255,0.15);
  }

  .close-btn {
    top: 22px;
    right: 22px;
  }

  .nav-btn.prev {
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
  }

  .nav-btn.next {
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
  }

  .nav-btn.prev:hover,
  .nav-btn.next:hover {
    transform: translateY(-50%);
  }

  .counter {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    color: #999;
    font-size: 13px;
    letter-spacing: 1px;
    background: rgba(0,0,0,0.5);
    padding: 5px 14px;
    border-radius: 20px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .gallery {
      columns: 2;
      column-gap: 14px;
      padding: 24px 16px 70px;
    }
  }

  @media (max-width: 560px) {
    header {
      padding: 56px 16px 36px;
    }

    .gallery {
      columns: 1;
      padding: 16px 12px 60px;
    }

    .photo {
      margin-bottom: 12px;
    }

    .close-btn {
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      font-size: 18px;
    }

    .nav-btn.prev { left: 10px; }
    .nav-btn.next { right: 10px; }
  }

  .photo.loading img {
    opacity: 0;
  }

  .photo.loaded img {
    animation: fadeIn 0.5s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="subtitle">PHOTO COLLECTION</div>
  <h1> Quỳnh Thư - Nude</h1>
</header>

<main class="gallery" id="gallery">
  <div class="photo loading">
    <img src="img/quynhthu-nude.jpg" 
         alt="Qthu1-Nude" loading="lazy">
    <div class="view-icon">↗</div>
  </div>

  <div class="photo loading">
    <img src="img/quynhthu.jpg" 
         alt="Qthu1" loading="lazy">
    <div class="view-icon">↗</div>
  </div>

  <div class="photo loading">
    <img src="img/quynhthu1-nude.jpg" 
         alt="Qthu2-Nude" loading="lazy">
    <div class="view-icon">↗</div>
  </div>

  <div class="photo loading">
    <img src="img/quynhthu1.jpg" 
         alt="Qthu2" loading="lazy">
    <div class="view-icon">↗</div>
  </div>
</main>

<footer>
  End of Collection
</footer>

<!-- LIGHTBOX -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <button class="close-btn" id="closeBtn" aria-label="Close">×</button>
  <button class="nav-btn prev" id="prevBtn" aria-label="Previous">‹</button>
  <button class="nav-btn next" id="nextBtn" aria-label="Next">›</button>
  
  <div class="viewer-content">
    <img id="viewerImage" src="" alt="Preview">
  </div>
  
  <div class="counter" id="counter">1 / 6</div>
</div>

<script>
  const photos = Array.from(document.querySelectorAll('.photo img'));
  const photoContainers = document.querySelectorAll('.photo');
  const viewer = document.getElementById('viewer');
  const viewerImage = document.getElementById('viewerImage');
  const counter = document.getElementById('counter');
  const closeBtn = document.getElementById('closeBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let currentIndex = 0;

  photoContainers.forEach((container) => {
    const img = container.querySelector('img');
    if (img.complete) {
      container.classList.remove('loading');
      container.classList.add('loaded');
    } else {
      img.addEventListener('load', () => {
        container.classList.remove('loading');
        container.classList.add('loaded');
      });
    }
  });

  photos.forEach((photo, index) => {
    photo.addEventListener('click', () => openViewer(index));
    photo.parentElement.addEventListener('click', (e) => {
      if (e.target === photo.parentElement || e.target.classList.contains('view-icon')) {
        openViewer(index);
      }
    });
  });

  function openViewer(index) {
    currentIndex = index;
    updateViewer();
    viewer.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeViewer() {
    viewer.classList.remove('active');
    document.body.style.overflow = '';
    setTimeout(() => { viewerImage.src = ''; }, 300);
  }

  function updateViewer() {
    const photo = photos[currentIndex];
    viewerImage.src = photo.src.replace('w=800', 'w=1600');
    viewerImage.alt = photo.alt;
    counter.textContent = `${currentIndex + 1} / ${photos.length}`;
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + photos.length) % photos.length;
    updateViewer();
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % photos.length;
    updateViewer();
  }

  closeBtn.addEventListener('click', closeViewer);
  prevBtn.addEventListener('click', showPrev);
  nextBtn.addEventListener('click', showNext);

  viewer.addEventListener('click', (e) => {
    if (e.target === viewer) closeViewer();
  });

  document.addEventListener('keydown', (e) => {
    if (!viewer.classList.contains('active')) return;
    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowLeft') showPrev();
    if (e.key === 'ArrowRight') showNext();
  });
</script>

</body>
</html>
